<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Transparent, trimmed mark. Don't swap in a raw logo export here: those
         ship with the transparency checkerboard baked in as opaque pixels and
         render as a white tile.
         All four files are the same artwork at different sizes. favicon.ico is
         load-bearing for search: Google's favicon crawler falls back to
         /favicon.ico at the root, and a PNG-only setup left it showing the
         default globe. icon-192 covers Google's multiple-of-48px guidance,
         which the 64x64 PNG does not meet. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mina Abdel-Masih</title>
    <!-- The apex is the real URL. All four host variants (http/https x www/apex)
         308 to it, but without this Google has to infer that, and it was
         reporting the www variant as "Page with redirect" / "HTTPS not
         evaluated" while it worked that out. Those reports are expected, not
         errors — this just settles the question outright. -->
    <link rel="canonical" href="https://minaabdel-masih.com/" />
    <!-- Required. Without it Google builds the snippet from rendered page text
         and catches the hero typing animation frozen mid-word. -->
    <meta
      name="description"
      content="Aspiring software engineer and Computer Science student at NC State focused on AI and full-stack development. See my skills, experience, and resume."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://kit.fontawesome.com/c30cb7580c.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
